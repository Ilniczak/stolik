<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>stolik · Warszawa na mapie</title>
  <meta name="description" content="Najlepsze kawiarnie, coworkingi i biblioteki do pracy z laptopem w Warszawie — na mapie, z Wi-Fi, gniazdkami i godzinami otwarcia." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" />
  <link rel="stylesheet" href="tokens.css?v=20261003c" />
  <link rel="stylesheet" href="styles.css?v=20261003c" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="stolik – strona główna">
      <span class="brand-mark" aria-hidden="true">☕</span>
      <span>stolik</span>
    </a>
    <nav class="topnav">
      <a href="./">O projekcie</a>
      <a href="#mapa" aria-current="page">Mapa</a>
      <a href="zaproponuj.html">Zaproponuj miejsce</a>
    </nav>
    <a class="gh-star" href="https://github.com/Ilniczak/stolik" target="_blank" rel="noopener" aria-label="Daj projektowi gwiazdkę na GitHubie">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.75 1-5.8L3.5 9.7l5.9-.9z"/></svg>
      <span class="gh-star-label">Gwiazdka</span>
      <span class="gh-star-count" data-gh-stars hidden></span>
    </a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Przełącz motyw">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Z"/></svg>
    </button>
  </header>

  <main>
    <section class="hero">
      <h1>Warszawa na mapie</h1>
      <p class="lede" id="lede">Miejsca, w których warto otworzyć laptopa.</p>

      <div class="chips" role="tablist" aria-label="Typ miejsca" id="typeChips"></div>
    </section>

    <section class="toolbar" aria-label="Filtry">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m21 21-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"/></svg>
        <input id="q" type="search" placeholder="Szukaj nazwy, ulicy…" autocomplete="off" />
      </label>
      <div class="toggles" id="toggles"></div>
      <div class="selects">
        <select id="district" aria-label="Dzielnica"></select>
        <select id="sort" aria-label="Sortowanie">
          <option value="score">Najlepsze do pracy</option>
          <option value="near">Najbliżej mnie</option>
          <option value="name">A–Z</option>
        </select>
      </div>
    </section>

    <section class="explorer" id="mapa">
      <div class="map-wrap">
        <div id="map" role="region" aria-label="Mapa miejsc"></div>
        <div class="legend" id="legend"></div>
      </div>

      <aside class="side" id="side">
        <div class="list-view" id="listView">
          <p class="list-head" id="listHead"></p>
          <ol class="list" id="list"></ol>
          <div class="empty" id="empty" hidden>
            <p>Nic nie pasuje do tych filtrów.</p>
            <button type="button" class="btn-ghost" id="resetBtn">Wyczyść filtry</button>
          </div>
          <a class="suggest-link" href="zaproponuj.html">
            <span aria-hidden="true">＋</span>
            <span><b>Brakuje miejsca?</b> Zaproponuj je na mapę</span>
          </a>
        </div>
        <article class="detail" id="detail" hidden aria-live="polite"></article>
      </aside>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
  <script src="places.js?v=20261003c"></script>
  <script src="hours.js?v=20261003c"></script>
  <script src="app.js?v=20261003c"></script>
  <script src="github-star.js?v=20261003c"></script>
</body>
</html>
